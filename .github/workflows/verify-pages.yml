name: Verify published page
on:
  workflow_dispatch:
permissions: {}
jobs:
  check-public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify public files and checksums
        run: |
          python3 - <<'PY'
          import urllib.request, hashlib, time
          base = "https://vldsmelov.github.io/thermal-routing-vkr/"
          expected = {'index.html': 'b2f2be9cf9f000b3b47bf1e7b7140bf74fbccc1e61a4b89b6c1aa346a1cdbc35', 'styles.css': '733c02a32e250f5b0123e192bbf1af0ee80590de355e91b5a005632f9879724d', 'app.js': '830442da8baf3fc9087109b7a842c19f7ae48f035c81191f5f28ba73d6611298', 'assets/generated/battery.png': '88c79bebbbdff1d7c0f36b73c36c14d6fe2729a2d2c33b21aec56f824501ca6d', 'assets/generated/benchmark.png': '677fc241eec984ac439d8c4cf219119c292ece584b02a3c18cb5f19b20d568ff', 'assets/generated/electronics.png': '9659234e259fad9abcce8785628e5cb7e72cb6baa6e1339e6129fa0d68b1613f', 'assets/generated/hero_a.png': 'd18fca5b4633d277e6b93c524cff7c817288b882e8fe2800ec6e51079005eeab', 'assets/generated/hero_b.png': 'ca0ce9c0718d671c897ad4e18a7c9dba637374c7154e6f51c371564b7e62b41d', 'assets/generated/homogeneous.png': 'b699a745db40e95506a8e5daa7f2ad159896bbbc9463d289444dd2489fbfdec9', 'assets/generated/router.png': '526b1bcdf85011c0333e518d53ad7a8e68bbc9116f1d0ebcd95f7b162c69409a', 'assets/generated/static.png': '048053107c7ba84e7593678853c2bb371277cda9a1e532122c86bcd01a0f801e'}
          for name, digest in expected.items():
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(base + name + "?v=f6f7315", timeout=30) as response:
                          status = response.status
                          data = response.read()
                      assert status == 200, (name, status)
                      assert hashlib.sha256(data).hexdigest() == digest, name + ": content mismatch"
                      print("OK 200 SHA256", name, flush=True)
                      break
                  except Exception:
                      if attempt == 4:
                          raise
                      time.sleep(10)
          print("Published HTML, styles, script and all 8 generated images verified.")
          PY
